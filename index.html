<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared Focus Timer</title>

  <!--
    Shared Focus Timer: a focus timer for two people. Each person runs their
    own timer; a corner pill shows whether the other person's is running.

    This file is markup only. Styles are in css/, behaviour in js/
    (js/main.js is where startup begins). README.md has the map.
  -->

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/widgets.css" />
</head>
<body>

  <!-- The background. Eight colour blobs; the centre wash and the film grain
       are pseudo-elements on the layer itself. aria-hidden because there's
       nothing here for a screen reader to say. -->
  <div id="backgroundLayer" aria-hidden="true">
    <span class="orbit o1"><span class="blob b1"></span></span>
    <span class="orbit o2"><span class="blob b2"></span></span>
    <span class="orbit o3"><span class="blob b3"></span></span>
    <span class="orbit o4"><span class="blob b4"></span></span>
    <span class="orbit o5"><span class="blob b5"></span></span>
    <span class="orbit o6"><span class="blob b6"></span></span>
    <span class="orbit o7"><span class="blob b7"></span></span>
    <span class="orbit o8"><span class="blob b8"></span></span>
  </div>

  <!-- Presence: whether the OTHER person is working right now. -->
  <div id="presenceWidget">
    <span class="dot" id="presenceDot"></span>
    <span id="presenceName">&nbsp;</span>
    <span id="presenceState">connecting…</span>
  </div>

  <main class="stage">
    <section class="card timer-card">
      <!-- The word is its own span because the render loop rewrites it
           ("Focus" / "Focusing" / "Done"); the heart sits outside it so it
           is never overwritten. -->
      <p class="eyebrow"><span id="stageLabel">Focus</span><span class="heart" aria-hidden="true">&#9829;</span></p>
      <div id="timerDisplay">25:00</div>
      <!-- Phone only: where the timer above actually runs. -->
      <p id="remoteNote"></p>

      <!-- Editable only while the timer isn't running. -->
      <label class="duration-row">
        Minutes
        <input id="durationInput" type="number" min="1" max="600" value="25" />
      </label>

      <div class="controls">
        <button id="startBtn" type="button">Start</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>

      <!-- Free-text category, editable any time, mid-session included. -->
      <div class="category-row">
        <input id="categoryInput" type="text" maxlength="40"
               placeholder="working on…" autocomplete="off" />
        <div id="categoryChips"></div>
      </div>

      <!-- Your status, for when you're not focusing. Hidden while the timer
           runs. Presets are filled in by js/status.js. -->
      <div id="statusRow">
        <p class="eyebrow" id="statusLabel">Your status</p>
        <div class="status-field">
          <input id="statusInput" type="text" maxlength="40"
                 placeholder="status — eating, out…" autocomplete="off"
                 enterkeyhint="done" />
          <button id="statusClear" type="button" aria-label="Clear status">&times;</button>
        </div>
        <div id="statusAge"></div>
        <div id="statusPresets"></div>
      </div>
    </section>
  </main>

  <!-- Bottom-left dock. Chips are <button>s so they're keyboard reachable.
       Panels come before chips so the widgets grow upward. -->
  <div id="cornerDock">
    <div id="statsWidget">
      <div id="statsPanel">
        <div class="stat-row"><span>Today</span><span id="statToday">—</span></div>
        <div class="stat-row"><span>This week</span><span id="statWeek">—</span></div>
        <div class="stat-row"><span>All time</span><span id="statAll">—</span></div>
        <div class="stat-note" id="statCount">no sessions logged yet</div>
      </div>
      <button id="statsChip" type="button">
        <span class="chip-label">Today</span>
        <span id="chipValue">—</span>
        <span id="chipCaret">▲</span>
      </button>
    </div>

    <div id="breakdownWidget">
      <div id="breakdownPanel">
        <div id="shareBar"></div>
        <div id="breakdownRows"></div>
        <div id="breakdownMore"></div>
        <button id="periodToggle" type="button">This week</button>
      </div>
      <button id="breakdownChip" type="button">
        <span class="chip-label">Split</span>
        <span id="breakdownTop">—</span>
        <span id="breakdownCaret">▲</span>
      </button>
    </div>
  </div>

  <!-- Bottom-right note. -->
  <div id="noteWidget">
    <div id="notePanel">
      <textarea id="noteInput" placeholder="next up, reminders, anything…"
                spellcheck="false"></textarea>
      <div id="noteStatus">&nbsp;</div>
    </div>
    <button id="noteChip" type="button">
      <span class="chip-label">Note</span>
      <span id="noteBadge" class="empty">—</span>
      <span id="noteCaret">&#9650;</span>
    </button>
  </div>

  <!-- Top-left messages. Chip before panel: anchored at the top, it grows
       downward. -->
  <div id="messageWidget">
    <button id="messageChip" type="button">
      <span id="messageIcon">&#9993;</span>
      <span id="messageBadge" class="empty">Message</span>
      <span id="messageCaret">&#9660;</span>
    </button>
    <div id="messagePanel">
      <div id="inboxSection">
        <div id="inboxFrom">&nbsp;</div>
        <div id="inboxText"></div>
      </div>
      <label id="composeLabel" for="messageInput">To&nbsp;<span id="composeTo"></span></label>
      <textarea id="messageInput" maxlength="500" rows="3"
                placeholder="waiting for you when you finish…"></textarea>
      <div id="messageSendRow">
        <button id="messageSend" type="button">Send</button>
        <span id="messageStatus">&nbsp;</span>
      </div>
    </div>
  </div>

  <div id="uidDebug"></div>

  <!-- Browsers refuse to load JavaScript modules from a file opened by
       double-click, so say so instead of showing a page that never
       connects. -->
  <script>
    if (location.protocol === "file:") {
      document.getElementById("presenceState").textContent =
        "open the GitHub Pages link — this file can't run on its own";
    }
  </script>

  <!-- Firebase's "compat" build, as plain scripts: they put a global
       `firebase` on the page, which js/firebase.js picks up. -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <!-- The app. type="module" runs after the page has parsed, so every
       element above exists by then. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
