<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared Focus Timer</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />

  <!--
    Shared Focus Timer: a focus timer for two people. Each person runs their
    own timer; a corner pill shows whether the other person's is running.

    This file is markup only. Styles are in css/, behaviour in js/
    (js/main.js is where startup begins). README.md has the map.
  -->

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/wallpapers/rain.css" />
  <link rel="stylesheet" href="css/wallpapers/hills.css" />
  <link rel="stylesheet" href="css/wallpapers/koi.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/widgets.css" />
</head>
<body>

  <!-- The background. One wrapper per wallpaper; data-bg (set by
       js/wallpapers.js) picks which one shows, and the hidden ones don't
       animate. The centre wash and the film grain are pseudo-elements on
       the layer itself, shared by all of them. aria-hidden because there's
       nothing here for a screen reader to say. -->
  <div id="backgroundLayer" data-bg="swirl" aria-hidden="true">
    <!-- Swirl: eight colour blobs circling the screen. -->
    <div class="wp wp-swirl">
    <span class="orbit o1"><span class="blob b1"></span></span>
    <span class="orbit o2"><span class="blob b2"></span></span>
    <span class="orbit o3"><span class="blob b3"></span></span>
    <span class="orbit o4"><span class="blob b4"></span></span>
    <span class="orbit o5"><span class="blob b5"></span></span>
    <span class="orbit o6"><span class="blob b6"></span></span>
    <span class="orbit o7"><span class="blob b7"></span></span>
    <span class="orbit o8"><span class="blob b8"></span></span>
    </div>

    <!-- Rainy window: city lights out of focus behind wet glass. -->
    <div class="wp wp-rain">
      <div class="rain-bokeh rain-bokeh-a"></div>
      <div class="rain-bokeh rain-bokeh-b"></div>
      <div class="rain-bokeh rain-bokeh-c"></div>
      <div class="rain-traffic">
        <span class="car head car-1"></span>
        <span class="car tail car-2"></span>
        <span class="car head car-3"></span>
      </div>
      <div class="rain-wind">
        <div class="rain-fall rain-fall-far"></div>
        <div class="rain-fall rain-fall-mid"></div>
        <div class="rain-fall rain-fall-near"></div>
      </div>
      <div class="rain-beads"></div>
      <span class="runner r1"></span>
      <span class="runner r2"></span>
      <span class="runner r3"></span>
      <span class="runner r4"></span>
      <span class="runner r5"></span>
      <span class="runner r6"></span>
      <span class="runner r7"></span>
    </div>

    <!-- Paper hills: cut-paper layers under a sky that follows the local
         time (js/sky.js sets the colours once a minute). -->
    <div class="wp wp-hills">
      <div class="hills-sky"></div>
      <div class="hills-stars"></div>
      <div class="hills-stars hills-stars-twinkle"></div>
      <div class="hills-sun"></div>
      <div class="hills-moon"></div>
      <svg class="paper-cloud cloud-1" viewBox="0 0 189 82"><g><circle cx="30" cy="60" r="19"/><circle cx="51" cy="56" r="25"/><circle cx="80" cy="51" r="34"/><circle cx="119" cy="57" r="23"/><circle cx="145" cy="59" r="20"/><rect x="14" y="56" width="161" height="22" rx="11"/></g></svg>
      <svg class="paper-cloud cloud-2" viewBox="0 0 203 82"><g><circle cx="30" cy="60" r="18"/><circle cx="50" cy="48" r="39"/><circle cx="96" cy="57" r="24"/><circle cx="124" cy="51" r="35"/><circle cx="164" cy="61" r="17"/><rect x="14" y="56" width="175" height="22" rx="11"/></g></svg>
      <svg class="paper-cloud cloud-3" viewBox="0 0 196 82"><g><circle cx="30" cy="59" r="20"/><circle cx="53" cy="54" r="29"/><circle cx="86" cy="57" r="24"/><circle cx="114" cy="49" r="38"/><circle cx="157" cy="61" r="16"/><rect x="14" y="56" width="168" height="22" rx="11"/></g></svg>
      <svg class="hills-land" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
        <defs>
          <!-- Each layer throws a soft shadow up onto the one behind it,
               which is what makes flat shapes read as cut paper. Static,
               so it is drawn once per colour change, not per frame. -->
          <filter id="paperShadow" x="-5%" y="-20%" width="110%" height="140%">
            <feDropShadow dx="0" dy="-5" stdDeviation="7" flood-color="#000" flood-opacity="0.22"/>
          </filter>
        </defs>
        <path class="hill hill-1" d="M-100,910 L-100,533 C-41,521 150,465 252,458 C355,451 423,488 515,490 C608,492 702,463 808,471 C914,479 1056,541 1151,538 C1247,534 1294,463 1380,450 C1467,436 1614,451 1670,458 C1727,466 1712,490 1720,496 L1720,910 Z"/>
        <path class="hill hill-2" d="M-100,910 L-100,529 C-49,544 122,615 206,617 C290,619 324,551 404,541 C484,531 599,554 684,557 C768,561 828,562 910,564 C991,565 1095,563 1173,566 C1251,569 1306,583 1380,581 C1454,578 1560,561 1617,552 C1674,544 1703,534 1720,530 L1720,910 Z"/>
        <path class="hill hill-3" d="M-100,910 L-100,682 C-63,680 49,676 125,671 C201,666 289,645 356,650 C424,655 457,695 529,700 C600,705 711,693 786,680 C860,667 908,628 976,620 C1044,613 1121,628 1193,633 C1265,638 1344,646 1411,649 C1477,652 1541,648 1592,649 C1644,651 1699,657 1720,659 L1720,910 Z"/>
        <path class="hill hill-4" d="M-100,910 L-100,770 C-65,769 38,759 108,761 C179,763 246,786 324,781 C401,775 480,737 571,730 C662,723 783,735 870,739 C957,743 1018,747 1094,753 C1169,758 1251,771 1325,774 C1398,777 1468,778 1533,772 C1599,765 1689,741 1720,735 L1720,910 Z"/>
      </svg>
    </div>

    <!-- Koi pond: looking straight down into a cut-paper pond. Back to
         front: the bank and four depths of water, the koi's shadows on the
         bottom, the koi (built by js/koi.js), lily pads, ripples, then the
         time-of-day light (js/sky.js) and the sun or moon's reflection. -->
    <div class="wp wp-koi">
      <svg class="pond-water" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Each depth sits under the edge of the one above it, so it
               gets a shadow just inside its rim: an inner shadow. Static,
               so it is drawn once, not per frame. -->
          <filter id="pondInset" x="-10%" y="-10%" width="120%" height="120%">
            <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
            <feGaussianBlur stdDeviation="9"/>
            <feOffset dx="0" dy="7" result="rim"/>
            <feFlood flood-color="#0c2b31" flood-opacity="0.42"/>
            <feComposite in2="rim" operator="in"/>
            <feComposite in2="SourceAlpha" operator="in" result="shadow"/>
            <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shadow"/></feMerge>
          </filter>
          <filter id="pondLift" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0c2b31" flood-opacity="0.28"/>
          </filter>
        </defs>
        <rect class="bank" x="-50" y="-50" width="1700" height="1000"/>
        <path class="depth depth-1" d="M1667,450 C1668,525 1669,610 1616,677 C1563,744 1453,801 1351,849 C1249,897 1129,945 1003,964 C877,984 718,988 596,966 C475,944 365,883 273,832 C181,781 114,724 44,660 C-25,597 -138,521 -143,450 C-147,379 -51,297 16,232 C83,167 165,113 260,59 C355,5 463,-73 586,-92 C709,-111 866,-74 999,-55 C1133,-35 1286,-22 1388,24 C1489,71 1562,154 1608,225 C1655,296 1666,375 1667,450 Z"/>
        <path class="depth depth-2" d="M1498,460 C1499,521 1441,585 1388,643 C1335,701 1274,777 1180,807 C1085,836 939,821 820,820 C701,819 566,828 468,800 C369,772 277,707 228,650 C180,594 178,524 176,460 C173,396 159,316 213,265 C267,213 398,182 499,150 C600,119 713,75 820,75 C927,74 1049,114 1143,148 C1236,183 1322,227 1382,279 C1441,331 1497,399 1498,460 Z"/>
        <path class="depth depth-3" d="M1355,470 C1362,519 1330,577 1285,623 C1239,670 1166,728 1082,748 C997,769 872,756 778,745 C684,734 587,714 515,682 C444,650 371,598 351,550 C331,503 367,445 395,397 C422,348 452,293 515,258 C579,223 682,195 775,185 C869,175 998,174 1076,199 C1153,223 1194,287 1241,332 C1287,377 1347,421 1355,470 Z"/>
        <path class="depth depth-4" d="M1211,480 C1208,522 1185,571 1139,603 C1092,635 1007,662 932,671 C856,679 751,675 686,654 C621,633 567,586 541,545 C514,505 495,445 526,412 C557,378 658,361 725,343 C792,325 856,303 927,304 C998,306 1105,322 1152,351 C1199,380 1213,438 1211,480 Z"/>
        <g class="stones">
          <ellipse cx="70" cy="40" rx="62" ry="40"/><ellipse class="stone-b" cx="168" cy="22" rx="40" ry="28"/>
          <ellipse class="stone-b" cx="20" cy="118" rx="34" ry="26"/>
          <ellipse cx="1545" cy="868" rx="70" ry="44"/><ellipse class="stone-b" cx="1440" cy="890" rx="44" ry="28"/>
          <ellipse class="stone-b" cx="1590" cy="770" rx="30" ry="36"/>
          <ellipse cx="1580" cy="30" rx="48" ry="34"/><ellipse class="stone-b" cx="28" cy="880" rx="52" ry="34"/>
        </g>
      </svg>
      <div class="koi-shadows"></div>
      <div class="koi-school"></div>
      <div class="pond-ripple rp-1"></div>
      <div class="pond-ripple rp-2"></div>
      <div class="pond-ripple rp-3"></div>
      <svg class="pond-pads" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <path class="pad pad-a" d="M205,175 L250,234 A74 74 0 1 1 271,209 Z"/><path class="pad-vein" d="M205,175 L215,233 M205,175 L162,216 M205,175 L147,163 M205,175 L183,120 M205,175 L238,126"/>
        <path class="pad pad-b" d="M318,250 L278,224 A48 48 0 1 1 270,244 Z"/><path class="pad-vein" d="M318,250 L299,217 M318,250 L335,215 M318,250 L356,245 M318,250 L344,279 M318,250 L309,287"/>
        <path class="pad pad-c" d="M150,300 L177,271 A40 40 0 1 1 162,262 Z"/><path class="pad-vein" d="M150,300 L180,289 M150,300 L176,319 M150,300 L149,332 M150,300 L123,317 M150,300 L121,287"/>
        <path class="pad pad-a" d="M1395,715 L1358,642 A82 82 0 1 1 1330,666 Z"/><path class="pad-vein" d="M1395,715 L1395,649 M1395,715 L1449,678 M1395,715 L1456,740 M1395,715 L1409,779 M1395,715 L1349,762"/>
        <path class="pad pad-b" d="M1290,800 L1338,820 A52 52 0 1 1 1342,797 Z"/><path class="pad-vein" d="M1290,800 L1317,832 M1290,800 L1279,840 M1290,800 L1250,813 M1290,800 L1257,774 M1290,800 L1293,759"/>
        <path class="pad pad-c" d="M1500,610 L1474,638 A38 38 0 1 1 1489,646 Z"/><path class="pad-vein" d="M1500,610 L1471,620 M1500,610 L1475,592 M1500,610 L1501,580 M1500,610 L1526,594 M1500,610 L1528,622"/>
        <path class="pad pad-b" d="M1450,160 L1409,181 A46 46 0 1 1 1422,197 Z"/><path class="pad-vein" d="M1450,160 L1413,160 M1450,160 L1429,129 M1450,160 L1464,126 M1450,160 L1486,152 M1450,160 L1476,186"/>
        <path class="pad pad-c" d="M1520,250 L1529,279 A30 30 0 1 1 1540,272 Z"/><path class="pad-vein" d="M1520,250 L1516,274 M1520,250 L1498,260 M1520,250 L1500,237 M1520,250 L1519,226 M1520,250 L1539,236"/>
        <path class="pad pad-c" d="M300,770 L339,750 A44 44 0 1 1 326,735 Z"/><path class="pad-vein" d="M300,770 L335,770 M300,770 L320,799 M300,770 L287,803 M300,770 L266,777 M300,770 L275,746"/>
        <g class="lotus"><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(0 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(45 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(90 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(135 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(180 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(225 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(270 212 168)"/><ellipse class="petal-outer" cx="212" cy="151" rx="13" ry="17" transform="rotate(315 212 168)"/><ellipse class="petal-inner" cx="212" cy="157" rx="10" ry="11" transform="rotate(30 212 168)"/><ellipse class="petal-inner" cx="212" cy="157" rx="10" ry="11" transform="rotate(90 212 168)"/><ellipse class="petal-inner" cx="212" cy="157" rx="10" ry="11" transform="rotate(150 212 168)"/><ellipse class="petal-inner" cx="212" cy="157" rx="10" ry="11" transform="rotate(210 212 168)"/><ellipse class="petal-inner" cx="212" cy="157" rx="10" ry="11" transform="rotate(270 212 168)"/><ellipse class="petal-inner" cx="212" cy="157" rx="10" ry="11" transform="rotate(330 212 168)"/><circle class="lotus-heart" cx="212" cy="168" r="8"/></g>
      </svg>
      <div class="pond-light"></div>
      <div class="pond-glint pond-glint-sun"></div>
      <div class="pond-glint pond-glint-moon"></div>
    </div>
  </div>

  <!-- Presence: whether the OTHER person is working right now. -->
  <div id="presenceWidget">
    <span class="dot" id="presenceDot"></span>
    <span id="presenceName">&nbsp;</span>
    <span id="presenceState">connecting…</span>
  </div>

  <main class="stage">
    <section class="card timer-card">
      <section id="completionPanel" aria-labelledby="completionTitle" hidden>
        <div role="status" aria-live="polite">
          <p class="eyebrow">Time’s up</p>
          <h2 id="completionTitle">Session complete</h2>
          <p id="completionDetail"></p>
        </div>
        <button id="alertDismiss" type="button">Got it</button>
      </section>
      <!-- The word is its own span because the render loop rewrites it
           ("Focus" / "Focusing" / "Done"); the heart sits outside it so it
           is never overwritten. -->
      <p class="eyebrow"><span id="stageLabel">Focus</span><span class="heart" aria-hidden="true">&#9829;</span></p>
      <div id="timerDisplay">25:00</div>
      <!-- Phone only: where the timer above actually runs. -->
      <p id="remoteNote"></p>

      <!-- The run's settings: countdown / stopwatch, then its length. Both
           are locked while the timer runs. In stopwatch mode the minutes box
           is swapped for the cap note, in the same spot. -->
      <div class="settings-row">
        <button id="modeToggle" type="button" aria-pressed="false">&darr; Countdown</button>
        <label class="duration-row" id="durationRow">
          Minutes
          <input id="durationInput" type="number" min="1" max="600" value="25" />
        </label>
        <p class="duration-row" id="capNote" hidden>Stops itself at 2 hours</p>
      </div>

      <div class="controls">
        <button id="startBtn" type="button">Start</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>

      <div class="alert-settings">
        <label for="alertVolume">Chime volume <output id="alertVolumeValue" for="alertVolume">75%</output></label>
        <div class="alert-volume-row">
          <input id="alertVolume" type="range" min="0" max="100" step="5" value="75" />
          <button id="alertPreview" type="button">Test sound</button>
        </div>
      </div>

      <!-- Free-text category, editable any time, mid-session included. -->
      <div class="category-row">
        <input id="categoryInput" type="text" maxlength="40"
               placeholder="working on…" autocomplete="off" />
        <div id="categoryChips"></div>
      </div>

      <!-- Your status, for when you're not focusing. Hidden while the timer
           runs. Presets are filled in by js/status.js. -->
      <div id="statusRow">
        <p class="eyebrow" id="statusLabel">Your status</p>
        <div class="status-field">
          <input id="statusInput" type="text" maxlength="40"
                 placeholder="status — eating, out…" autocomplete="off"
                 enterkeyhint="done" />
          <button id="statusClear" type="button" aria-label="Clear status">&times;</button>
        </div>
        <div id="statusAge"></div>
        <div id="statusPresets"></div>
      </div>
    </section>
  </main>

  <!-- Bottom-left dock. Chips are <button>s so they're keyboard reachable.
       Panels come before chips so the widgets grow upward. -->
  <div id="cornerDock">
    <div id="statsWidget">
      <div id="statsPanel">
        <div class="stat-row"><span>Today</span><span id="statToday">—</span></div>
        <div class="stat-row"><span>This week</span><span id="statWeek">—</span></div>
        <div class="stat-row"><span>All time</span><span id="statAll">—</span></div>
        <div class="stat-note" id="statCount">no sessions logged yet</div>
        <!-- Filled in by js/wallpapers.js. -->
        <div id="wallpaperPicker">
          <div class="picker-label">Wallpaper</div>
          <div id="wallpaperList"></div>
        </div>
      </div>
      <button id="statsChip" type="button">
        <span class="chip-label">Today</span>
        <span id="chipValue">—</span>
        <span id="chipCaret">▲</span>
      </button>
    </div>

    <div id="breakdownWidget">
      <div id="breakdownPanel">
        <div id="shareBar"></div>
        <div id="breakdownRows"></div>
        <div id="breakdownMore"></div>
        <div class="breakdown-toggles">
          <button id="whoseToggle" type="button">You</button>
          <button id="periodToggle" type="button">This week</button>
        </div>
      </div>
      <button id="breakdownChip" type="button">
        <span class="chip-label" id="breakdownLabel">Split</span>
        <span id="breakdownTop">—</span>
        <span id="breakdownCaret">▲</span>
      </button>
    </div>
  </div>

  <!-- Bottom-right note. -->
  <div id="noteWidget">
    <div id="notePanel">
      <textarea id="noteInput" placeholder="next up, reminders, anything…"
                spellcheck="false"></textarea>
      <div id="noteStatus">&nbsp;</div>
    </div>
    <button id="noteChip" type="button">
      <span class="chip-label">Note</span>
      <span id="noteBadge" class="empty">—</span>
      <span id="noteCaret">&#9650;</span>
    </button>
  </div>

  <!-- Top-left messages. Chip before panel: anchored at the top, it grows
       downward. -->
  <div id="messageWidget">
    <button id="messageChip" type="button">
      <span id="messageIcon">&#9993;</span>
      <span id="messageBadge" class="empty">Message</span>
      <span id="messageCaret">&#9660;</span>
    </button>
    <div id="messagePanel">
      <div id="inboxSection">
        <div id="inboxFrom">&nbsp;</div>
        <div id="inboxText"></div>
      </div>
      <label id="composeLabel" for="messageInput">To&nbsp;<span id="composeTo"></span></label>
      <textarea id="messageInput" maxlength="500" rows="3"
                placeholder="waiting for you when you finish…"></textarea>
      <div id="messageSendRow">
        <button id="messageSend" type="button">Send</button>
        <span id="messageStatus">&nbsp;</span>
      </div>
    </div>
  </div>

  <div id="uidDebug"></div>

  <!-- Browsers refuse to load JavaScript modules from a file opened by
       double-click, so say so instead of showing a page that never
       connects. -->
  <script>
    if (location.protocol === "file:") {
      document.getElementById("presenceState").textContent =
        "open the GitHub Pages link — this file can't run on its own";
    }
  </script>

  <!-- Firebase's "compat" build, as plain scripts: they put a global
       `firebase` on the page, which js/firebase.js picks up. -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <!-- The app. type="module" runs after the page has parsed, so every
       element above exists by then. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
