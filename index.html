      // onDisconnect instruction is bound to one specific connection and does
      // not survive a reconnect. Without re-arming here, the FIRST wifi drop
      // would be handled and the second would not. This is what makes a
      // closed tab, a sleeping laptop and lost wifi all read as "not working".
      db.ref(".info/connected").on("value", (snap) => {
        if (snap.val() === true) {
          myRef.onDisconnect().update({ running: false });
        }
      });

      // ============================================================
      // 6. STATS
      // ============================================================
      // The whole log is held in memory and re-summed on demand. Considered
      // maintaining running totals in the database instead; rejected because
      // rollup counters have to be recomputed the moment the buckets change
      // (a category filter, a different week start) and this app will never
      // hold more than a few thousand tiny records.
      const sessionLog = [];

      const chipValue  = document.getElementById("chipValue");
      const statToday  = document.getElementById("statToday");
      const statWeek   = document.getElementById("statWeek");
      const statAll    = document.getElementById("statAll");
      const statCount  = document.getElementById("statCount");
      const statsWidget = document.getElementById("statsWidget");

      document.getElementById("statsChip").addEventListener("click", () => {
        statsWidget.classList.toggle("expanded");
      });

      function formatTotal(seconds) {
        const minutes = Math.round(seconds / 60);
        if (minutes < 60) return minutes + "m";
        return Math.floor(minutes / 60) + "h " + (minutes % 60) + "m";
      }

      // Boundaries built from the local calendar rather than by subtracting
      // 86,400,000ms: a DST change makes a day something other than 24 hours
      // and the arithmetic version quietly misfiles sessions for a week.
      // Week starts Monday.
      function renderStats() {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const daysSinceMonday = (now.getDay() + 6) % 7;
        const startOfWeek = new Date(
          now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday
        ).getTime();

        let today = 0, week = 0, all = 0;
        for (const s of sessionLog) {
          all += s.elapsedSeconds;
          if (s.endedAt >= startOfWeek) week += s.elapsedSeconds;
          if (s.endedAt >= startOfToday) today += s.elapsedSeconds;
        }

        chipValue.textContent = formatTotal(today);
        statToday.textContent = formatTotal(today);
        statWeek.textContent  = formatTotal(week);
        statAll.textContent   = formatTotal(all);
        statCount.textContent = sessionLog.length === 1
          ? "1 session logged"
          : sessionLog.length + " sessions logged";
      }

      // ============================================================
      // 7. CATEGORIES
      // ============================================================
      // Colours are assigned automatically on a category's first use, so
      // there is never a colour-picking step. Warm hues chosen to sit on the
      // cream surface without any of them reading as an error state.
      // CATEGORY_PALETTE, OTHER_COLOR, UNCATEGORIZED_KEY and catMap used to
      // be declared here. They now live at the top of initApp because
      // logSession() reads them and can run before this point — see the
      // comment there. Don't move them back.

      // Case and stray whitespace must not fragment the data: "Thesis",
      // "thesis " and "THESIS" all have to land on one key, or free text
      // quietly turns into three categories that are really one.
      function normalizeKey(text) {
        return text.trim().toLowerCase().replace(/\s+/g, " ");
      }

      function pickColor() {
        const used = new Set(Object.values(catMap).map((c) => c.color));
        const free = CATEGORY_PALETTE.find((c) => !used.has(c));
        return free || CATEGORY_PALETTE[Object.keys(catMap).length % CATEGORY_PALETTE.length];
      }

      function colorFor(key) {
        if (key === UNCATEGORIZED_KEY) return OTHER_COLOR;
        return (catMap[key] && catMap[key].color) || OTHER_COLOR;
      }

      // Falls back to the raw key so a session still renders with a sensible
      // name if its vocabulary entry is somehow missing.
      function labelFor(key) {
        if (key === UNCATEGORIZED_KEY) return "Uncategorized";
        return (catMap[key] && catMap[key].label) || key;
      }

      const categoryInput = document.getElementById("categoryInput");
      const categoryChips = document.getElementById("categoryChips");
      categoryInput.value = timer.categoryLabel || "";

      function setCategory(label) {
        timer.categoryLabel = label;
        categoryInput.value = label;
        save();
        if (timer.running) publishCategory();
      }

      categoryInput.addEventListener("input", (e) => {
        timer.categoryLabel = e.target.value;
        save();
      });
      // Published on blur/enter rather than on every keystroke — otherwise
      // her widget would watch you type.
      // Snap a typed variant back to the category's established spelling, so
      // the input agrees with what the chips and breakdown show.
      function snapToKnownLabel() {
        const typed = (timer.categoryLabel || "").trim();
        if (!typed) return;
        const known = catMap[normalizeKey(typed)] && catMap[normalizeKey(typed)].label;
        if (known && known !== typed) {
          timer.categoryLabel = known;
          categoryInput.value = known;
          save();
        }
      }

      categoryInput.addEventListener("change", () => {
        snapToKnownLabel();
        if (timer.running) publishCategory();
      });
      categoryInput.addEventListener("blur", () => {
        snapToKnownLabel();
        if (timer.running) publishCategory();
      });

      // Chips are the recently-used categories, most recent first. This is
      // the whole "picker": nothing was configured, the list is just a view
      // over what has actually been typed.
      function renderChips() {
        const keys = Object.keys(catMap)
          .sort((a, b) => (catMap[b].lastUsedAt || 0) - (catMap[a].lastUsedAt || 0))
          .slice(0, 5);

        if (keys.length < 2) {
          categoryChips.classList.remove("visible");
          categoryChips.innerHTML = "";
          return;
        }

        categoryChips.innerHTML = "";
        for (const key of keys) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "cat-chip";
          const swatch = document.createElement("span");
          swatch.className = "swatch";
          swatch.style.background = colorFor(key);
          const text = document.createElement("span");
          text.textContent = labelFor(key);
          chip.appendChild(swatch);
          chip.appendChild(text);
          chip.addEventListener("click", () => setCategory(labelFor(key)));
          categoryChips.appendChild(chip);
        }
        categoryChips.classList.add("visible");
      }

      // ---- Breakdown widget ----
      const PERIOD_LABELS = ["Today", "This week", "All time"];
      // Defaults to the week: today is often one category or empty, and all
      // time stops moving after a month and stops telling you anything.
      let periodIndex = 1;

      const shareBar       = document.getElementById("shareBar");
      const breakdownRows  = document.getElementById("breakdownRows");
      const breakdownMore  = document.getElementById("breakdownMore");
      const breakdownTop   = document.getElementById("breakdownTop");
      const periodToggle   = document.getElementById("periodToggle");
      const breakdownWidget = document.getElementById("breakdownWidget");

      document.getElementById("breakdownChip").addEventListener("click", () => {
        breakdownWidget.classList.toggle("expanded");
      });
      periodToggle.addEventListener("click", () => {
        periodIndex = (periodIndex + 1) % PERIOD_LABELS.length;
        renderBreakdown();
      });

      function periodStart() {
        if (periodIndex === 2) return 0;
        const now = new Date();
        const startOfToday =
          new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        if (periodIndex === 0) return startOfToday;
        const daysSinceMonday = (now.getDay() + 6) % 7;
        return new Date(
          now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday
        ).getTime();
      }

      function renderBreakdown() {
        const from = periodStart();
        const totals = {};
        let grand = 0;

        for (const session of sessionLog) {
          if (session.endedAt < from) continue;
          const key = session.categoryKey || UNCATEGORIZED_KEY;
          totals[key] = (totals[key] || 0) + session.elapsedSeconds;
          grand += session.elapsedSeconds;
        }

        const ranked = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
        const top = ranked.slice(0, 3);
        const restSeconds = ranked.slice(3).reduce((n, k) => n + totals[k], 0);

        periodToggle.textContent = PERIOD_LABELS[periodIndex];
        breakdownTop.textContent = top.length ? labelFor(top[0]) : "—";

        shareBar.innerHTML = "";
        breakdownRows.innerHTML = "";

        if (!grand) {
          breakdownMore.textContent =
            "nothing logged " + PERIOD_LABELS[periodIndex].toLowerCase();
          return;
        }

        for (const key of top) {
          const segment = document.createElement("div");
          segment.style.width = (totals[key] / grand * 100) + "%";
          segment.style.background = colorFor(key);
          shareBar.appendChild(segment);

          const row = document.createElement("div");
          row.className = "cat-row";
          const swatch = document.createElement("span");
          swatch.className = "swatch";
          swatch.style.background = colorFor(key);
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = labelFor(key);
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = formatTotal(totals[key]);
          row.appendChild(swatch);
          row.appendChild(name);
          row.appendChild(time);
          breakdownRows.appendChild(row);
        }

        // Everything past the top three becomes one neutral segment, so the
        // bar always sums to the real total rather than to just the top few.
        if (restSeconds > 0) {
          const segment = document.createElement("div");
          segment.style.width = (restSeconds / grand * 100) + "%";
          segment.style.background = OTHER_COLOR;
          shareBar.appendChild(segment);
          breakdownMore.textContent =
            "+ " + (ranked.length - 3) + " more · " + formatTotal(restSeconds);
        } else {
          breakdownMore.textContent = "";
        }
      }

      // ============================================================
      // 8. NOTE
      // ============================================================
      const NOTE_SAVE_MS = 800;

      const noteWidget = document.getElementById("noteWidget");
      const noteInput  = document.getElementById("noteInput");
      const noteBadge  = document.getElementById("noteBadge");
      const noteStatus = document.getElementById("noteStatus");

      // A local mirror of the note, painted before Firebase answers. Without
      // it the box sits visibly empty for the few hundred ms the round trip
      // takes, which reads as "my notes are gone" on every single load.
      const NOTE_CACHE_KEY = "noteCache:" + ME;

      // noteTimer non-null means there are keystrokes not yet written.
      // noteRemote holds a value that arrived from his other device while it
      // was unsafe to apply — see applyRemoteNote().
      let noteTimer  = null;
      let noteRemote = null;

      noteInput.value = localStorage.getItem(NOTE_CACHE_KEY) || "";

      // The chip has to say something while collapsed or it is just a
      // button. The first non-blank line is what a note like this leads
      // with, and it is the part worth glancing at without expanding.
      function renderNoteChip() {
        const first = noteInput.value.split("\n").find((l) => l.trim()) || "";
        noteBadge.textContent = first.length > 22
          ? first.slice(0, 21).trimEnd() + "…"
          : (first || "—");
        noteBadge.classList.toggle("empty", !first);
      }

      // Debounced rather than written on every keystroke: a note is typed in
      // bursts, and one write per character would be hundreds of round trips
      // for a single line of text.
      function saveNote() {
        noteTimer = null;
        localStorage.setItem(NOTE_CACHE_KEY, noteInput.value);
        noteStatus.textContent = "saving…";
        notesRef
          .set({
            text: noteInput.value,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
          })
          .then(() => {
            noteStatus.textContent = "saved";
            // Only clear it if nothing new has been typed since — otherwise
            // this timeout would wipe a live "saving…" two seconds later.
            setTimeout(() => {
              if (noteTimer === null) noteStatus.textContent = "";
            }, 2000);
          })
          .catch(() => {
            noteStatus.textContent = "offline — kept on this device";
          });
      }

      // A remote value is applied only when it cannot destroy work in
      // progress: not while the box is focused, and not while a debounced
      // save is still pending. Only this person's own browsers ever write
      // here, so a remote change is his other device — worth taking, but
      // never over live keystrokes.
      function applyRemoteNote() {
        if (noteRemote === null) return;
        if (noteTimer !== null) return;
        if (document.activeElement === noteInput) return;
        noteInput.value = noteRemote;
        noteRemote = null;
        localStorage.setItem(NOTE_CACHE_KEY, noteInput.value);
        renderNoteChip();
      }

      document.getElementById("noteChip").addEventListener("click", () => {
        noteWidget.classList.toggle("expanded");
        if (noteWidget.classList.contains("expanded")) noteInput.focus();
      });

      noteInput.addEventListener("input", () => {
        // A keystroke is newer intent than any queued remote value, so drop
        // it. Without this, finishing a sentence and clicking away could
        // restore the version his other laptop sent mid-typing.
        noteRemote = null;
        renderNoteChip();
        noteStatus.textContent = "";
        if (noteTimer !== null) clearTimeout(noteTimer);
        noteTimer = setTimeout(saveNote, NOTE_SAVE_MS);
      });

      // Blur is the moment a queued remote value becomes safe to apply.
      // Without this hook an edit made on the other laptop would sit
      // unapplied until a reload, because the value subscription has already
      // fired and will not fire again on its own.
      noteInput.addEventListener("blur", applyRemoteNote);

      renderNoteChip();


      // ============================================================
      // 9. MESSAGES  (6g, added 2026-09-11)
      // ============================================================
      // A small note you leave for the other person that stays sealed while
      // they are working. They see only that something is waiting; the text
      // itself opens when their timer ends (or right away if they aren't in
      // a session — a message that can only be opened by starting a timer
      // would sit unread forever on a day they never start one).
      //
      // THE POINT IS THE RESTRAINT. Nothing here makes a sound, flashes the
      // title, raises a notification of its own or expands a panel. A grey
      // dot turns terracotta and a label changes. Anything louder would be
      // an interruption, which is the exact thing this feature exists to
      // avoid.
      //
      // ---- Schema, and the cross-write ----
      //
      //   messages/<recipient>/note : { text, sentAt }   written by the SENDER
      //   messages/<recipient>/read : <sentAt of the message that was read>
      //                                                  written by the RECIPIENT
      //
      // Two separate children rather than one object with a `readAt` field,
      // and that split is load-bearing: the security rules have to let the
      // sender write the text but NOT the read receipt, and let the
      // recipient write the receipt but NOT the text. Firebase rules apply
      // per path, so two children can be governed separately while two
      // fields of one object written with set() cannot — a set() carrying
      // both would be rejected as a whole.
      //
      // `read` stores the message's own sentAt rather than "when it was
      // read", so unread is an exact equality check and nothing depends on
      // comparing two machines' clocks.
      //
      // ONE SLOT PER DIRECTION, newest wins (decided 2026-09-11). A second
      // message replaces the first rather than queueing behind it. What
      // keeps that from silently eating work: the compose box is PREFILLED
      // with whatever is still pending, so sending again is visibly editing
      // the thing that's waiting, not firing into a void. Once it's been
      // read the box clears, and the next thing typed is a new message.

      const messageWidget = document.getElementById("messageWidget");
      const messageChip   = document.getElementById("messageChip");
      const messageIcon   = document.getElementById("messageIcon");
      const messageBadge  = document.getElementById("messageBadge");
      const messageInput  = document.getElementById("messageInput");
      const messageSend   = document.getElementById("messageSend");
      const messageStatus = document.getElementById("messageStatus");
      const inboxSection  = document.getElementById("inboxSection");
      const inboxFrom     = document.getElementById("inboxFrom");
      const inboxText     = document.getElementById("inboxText");

      document.getElementById("composeTo").textContent = DISPLAY_NAME[THEM];
      messageInput.placeholder =
        "waiting for " + DISPLAY_NAME[THEM] + " when they finish\u2026";

      // Mirrors the remote outgoing text. The compose box is only
      // overwritten while it still holds exactly this — the moment he types
      // anything, his text is newer intent and the remote value is dropped.
      // Same hazard the note widget handles, same answer.
      let outboxApplied = "";

      function hasUnread() {
        if (!inbox || !inbox.note || !inbox.note.text) return false;
        return inbox.read !== inbox.note.sentAt;
      }

      // The gate is the running timer and nothing else. Not "paused", not
      // "has a timer today" — if you are not counting down right now there
      // is nothing to protect you from.
      function inboxSealed() { return timer.running; }

      function timeOfDay(ms) {
        try {
          return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        } catch (e) { return ""; }
      }

      // Called four times a second from the render loop, so it exits early
      // unless the visible state actually changed. Cheap to call, free to
      // call often, and no caller has to know when to call it.
      let lastChipKey = "";
      function renderMessageChip() {
        const unread = hasUnread();
        const sealed = inboxSealed();
        const key = unread + "|" + sealed;
        if (key === lastChipKey) return;
        lastChipKey = key;

        messageIcon.classList.toggle("live", unread);
        messageBadge.classList.toggle("waiting", unread);
        messageBadge.classList.toggle("empty", !unread);
        messageBadge.textContent = !unread ? "Message"
          : sealed ? "message when you're done"
                   : "1 message \u2014 read it";

        // The panel's sealed/unsealed text has to follow the chip, or a
        // panel left open across the zero crossing would still say "sealed".
        renderInbox();
      }

      function renderInbox() {
        if (!inbox || !inbox.note || !inbox.note.text) {
          inboxSection.classList.remove("shown");
          return;
        }
        inboxSection.classList.add("shown");
        inboxFrom.textContent = "From " + DISPLAY_NAME[THEM];

        if (hasUnread() && inboxSealed()) {
          inboxText.textContent = "Sealed until this session ends.";
          inboxText.classList.add("locked");
          return;
        }
        inboxText.textContent = inbox.note.text;
        inboxText.classList.remove("locked");
        maybeMarkRead();
      }

      // The receipt is written when the text is actually on screen — panel
      // open, not sealed — rather than when the message arrives. A "read"
      // that fires while the panel is shut would make the receipt a lie, and
      // the receipt is the only thing telling the sender whether to expect
      // an answer.
      function maybeMarkRead() {
        if (!hasUnread()) return;
        if (!messageWidget.classList.contains("expanded")) return;
        if (inboxSealed()) return;
        const stamp = inbox.note.sentAt;
        inbox.read = stamp;                 // optimistic: the chip settles now
        lastChipKey = "";                   // force the next render to redraw
        inboxRef.child("read").set(stamp).catch(() => {});
      }

      function renderOutboxStatus() {
        if (!outbox || !outbox.note || !outbox.note.text) {
          messageStatus.textContent = "nothing waiting";
          return;
        }
        if (outbox.read === outbox.note.sentAt) {
          messageStatus.textContent =
            "read " + timeOfDay(outbox.read) + " \u00b7 send another";
        } else {
          messageStatus.textContent = "waiting for " + DISPLAY_NAME[THEM];
        }
      }

      function syncSendButton() {
        messageSend.disabled = !messageInput.value.trim();
      }

      // Only ever overwrites a compose box he hasn't touched. `desired` is
      // empty once the message has been read, so the box clears itself
      // rather than inviting an accidental resend of something already
      // delivered.
      function applyRemoteOutbox() {
        const pending = outbox && outbox.note && outbox.note.text
          && outbox.read !== outbox.note.sentAt;
        const desired = pending ? outbox.note.text : "";
        if (messageInput.value !== outboxApplied) return;   // he has edited
        if (document.activeElement === messageInput) return;
        messageInput.value = desired;
        outboxApplied = desired;
        syncSendButton();
      }

      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        messageStatus.textContent = "sending\u2026";
        // set() on the `note` child alone, never on the parent: the parent
        // also holds `read`, which the rules reserve for the recipient, and
        // a write touching it would be rejected whole.
        outboxRef.child("note").set({
          text: text,
          sentAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
          outboxApplied = messageInput.value;
          messageStatus.textContent = "waiting for " + DISPLAY_NAME[THEM];
        }).catch(() => {
          messageStatus.textContent = "couldn't send \u2014 check your connection";
        });
      }

      messageChip.addEventListener("click", () => {
        messageWidget.classList.toggle("expanded");
        if (messageWidget.classList.contains("expanded")) {
          renderInbox();      // which marks it read, if it's readable now
          renderOutboxStatus();
        }
      });

      messageInput.addEventListener("input", syncSendButton);
      messageInput.addEventListener("blur", applyRemoteOutbox);
      messageInput.addEventListener("keydown", (e) => {
        // Plain Enter stays a newline — a message worth waiting for is
        // often more than one line.
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          sendMessage();
        }
      });
      messageSend.addEventListener("click", sendMessage);

      syncSendButton();
      renderMessageChip();
      renderOutboxStatus();

      // ---- Data subscriptions, attached last ----
      // Deliberately the final thing initApp does. Both callbacks render,
      // and rendering touches `const`/`let` bindings declared throughout
      // this function — attaching earlier means a callback that fires before
      // those lines have run hits a temporal dead zone. Firebase delivers
      // these asynchronously so it would work in practice, but "works
      // because of callback timing" is not a property worth relying on.

      // child_added fires once per existing record on first attach, then
      // once per new one — so this is both the initial load and the live
      // update, and it never re-downloads history that hasn't changed.
      // Note: endedAt arrives first as Firebase's local estimate of the
      // server clock and is corrected moments later. The estimate is within
      // the clock offset, which cannot move a session across a day boundary
      // in any realistic case, so the correction is not listened for.
      sessionsRef.on("child_added", (snap) => {
        const v = snap.val();
        if (!v || typeof v.elapsedSeconds !== "number") return;
        sessionLog.push({
          endedAt: v.endedAt || Date.now(),
          elapsedSeconds: v.elapsedSeconds,
          // Records written before categories existed carry
          // `category: "uncategorized"` instead of `categoryKey`.
          categoryKey: v.categoryKey || v.category || UNCATEGORIZED_KEY
        });
        renderStats();
        renderBreakdown();
      });

      // Small enough to re-read whole on every change — a handful of tiny
      // objects, and a full snapshot keeps deletions handled for free.
      categoriesRef.on("value", (snap) => {
        catMap = snap.val() || {};
        // The vocabulary has landed, so a session recovered from a crash can
        // now be written without repainting an established category.
        flushRecovery();
        renderChips();
        renderBreakdown();
      });

      // Small, single-purpose and read whole — which also makes this the
      // initial load, the same trick categoriesRef uses above.
      notesRef.on("value", (snap) => {
        const v = snap.val();
        noteRemote = (v && typeof v.text === "string") ? v.text : "";
        applyRemoteNote();
      });

      // Both message nodes are two small children read whole, the same
      // shape as notesRef — which makes each of these the initial load as
      // well as the live update.
      inboxRef.on("value", (snap) => {
        inbox = snap.val() || null;
        lastChipKey = "";       // the underlying data changed, so force a redraw
        renderMessageChip();
      });

      outboxRef.on("value", (snap) => {
        outbox = snap.val() || null;
        applyRemoteOutbox();
        renderOutboxStatus();
      });

      renderChips();
      renderBreakdown();

      // Re-sum periodically so the buckets roll over at midnight without a
      // refresh. Cheap: a loop over a few hundred numbers, twice a minute.
      setInterval(() => { renderStats(); renderBreakdown(); }, 30000);
      renderStats();

      // ---- Recovery, then the clock ----
      // Recovery runs BEFORE the first render, so updateDisplay() never sees
      // the stale running-and-past-zero state that produced the original
      // crash. Everything it touches — catMap, publish(), the element
      // handles — has been declared by this point, which is the property the
      // old ordering silently lacked.
      recoverInterruptedRun();

      // Backstop: if Firebase hasn't delivered the vocabulary within five
      // seconds, write the recovered session anyway. Losing it to an offline
      // laptop would be the same outcome as the bug.
      setTimeout(flushRecovery, 5000);

      // Re-arm the zero-crossing wakeup for a timer that was already
      // running when the page loaded — a refresh mid-session would
      // otherwise be left relying on the throttled render loop alone.
      scheduleAlarm();

      setInterval(updateDisplay, 250);
      updateDisplay();
    }
  </script>
</body>
</html>
